name: Fork CI - reuse prepared map data

on:
  push:
    branches: [ci-fork-reuse-map, ci-fork-reuse-map-failure]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: talos

jobs:
  build:
    name: Quality and source build
    if: github.repository == 'iamDuckduck/Atlos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fork-ci-setup
      - name: Validate data, check TypeScript, lint and build both sites
        run: node scripts/tasks.mjs ci-build --source-only
      - name: Upload source build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: overlap-source-builds-${{ github.run_attempt }}
          path: |
            talos/dist/oss/
            talos/dist/r2/
          include-hidden-files: true
          retention-days: 1

  tests:
    name: All test suites
    if: github.repository == 'iamDuckduck/Atlos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fork-ci-setup
      - name: Prepare test data
        id: prepare
        run: pnpm data prepare --source-only
      - name: Script tests
        run: pnpm test --app scripts
      - name: Main and Relink tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm exec vitest run
      - name: World tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm test --app world
      - name: Intel tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm test --app intel
      - name: User Hub tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm test --app user-hub
