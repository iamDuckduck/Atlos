name: Fork CI - overlap build and tests

on:
  push:
    branches:
      - ci-fork-overlap
      - ci-fork-overlap-benchmark
      - ci-fork-overlap-failure

permissions:
  contents: read

defaults:
  run:
    working-directory: talos

jobs:
  build:
    name: Quality and source build
    if: github.repository == 'iamDuckduck/Atlos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fork-ci-setup
      - name: Prepare and validate map data
        run: |
          pnpm data prepare --source-only
          pnpm data check --source-only
      - name: TypeScript
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Build both sites
        run: pnpm build --target all --source-only --skip-subset
      - name: Upload source build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: overlap-source-builds-${{ github.run_attempt }}
          path: |
            talos/dist/oss/
            talos/dist/r2/
          include-hidden-files: true
          retention-days: 1

  tests:
    name: All test suites
    if: github.repository == 'iamDuckduck/Atlos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fork-ci-setup
      - name: Prepare test data
        id: prepare
        run: pnpm data prepare --source-only
      - name: Script tests
        run: pnpm test --app scripts
      - name: Main and Relink tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm exec vitest run
      - name: World tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm test --app world
      - name: Intel tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm test --app intel
      - name: User Hub tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm test --app user-hub

  baseline:
    name: Sequential control
    if: github.repository == 'iamDuckduck/Atlos' && github.ref_name == 'ci-fork-overlap-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fork-ci-setup
      - name: Run sequential checks and build both sites
        env:
          ATLOS_FORK_SEQUENTIAL_REPORT: '1'
        run: pnpm check --build --source-only --skip-subset
      - name: Upload source build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sequential-source-builds-${{ github.run_attempt }}
          path: |
            talos/dist/oss/
            talos/dist/r2/
          include-hidden-files: true
          retention-days: 1
